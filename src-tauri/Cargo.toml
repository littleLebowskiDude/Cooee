[package]
name = "cooee"
version = "1.0.1"
description = "Push-to-talk local dictation"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cooee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Two instances would both install a global keyboard hook and double-type.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
rubato = "0.16"
arboard = "3"
dirs = "5"
once_cell = "1"

# Real ASR. Feature-gated: the app builds and the whole pipeline runs without it.
whisper-rs = { version = "0.14", optional = true }
tauri-plugin-dialog = "2"

# ONNX Runtime engine (encoder on the Hexagon NPU via the QNN plugin EP).
# `load-dynamic`: the app loads whatever onnxruntime.dll sits beside it (or
# ORT_DYLIB_PATH) rather than downloading a binary at build time. See docs/NPU.md.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "api-23", "load-dynamic", "half"] }
realfft = { version = "3", optional = true }
half = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[features]
# Default build needs NO C++ toolchain - uses the mock engine.
default = []
# Enable once MSVC ARM64 + CMake are present: cargo build --features whisper
whisper = ["dep:whisper-rs"]
# ONNX Runtime + QNN NPU engine: cargo build --features onnx
onnx = ["dep:ort", "dep:realfft", "dep:half"]

[[example]]
name = "ort_bench"
required-features = ["onnx"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
